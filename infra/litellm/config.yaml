# LiteLLM proxy — one model group per agent role. Free tiers first; Anthropic as the
# paid fallback / verifier family. App code calls model names like "dp-research".
#
# NOTE (M2): exact provider model ids below must be confirmed against each provider's
# model list when the gateway is wired up; limits are from docs/research (2026-11-17).

model_list:
  # ---------- producers: research / modeling / forensic / orchestrator ----------
  - model_name: dp-producer
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
    model_info: { family: gemini }
  - model_name: dp-producer
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
      tpm: 8000
    model_info: { family: gpt-oss }
  - model_name: dp-producer
    litellm_params:
      model: openrouter/openai/gpt-oss-120b:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
    model_info: { family: gpt-oss }

  # Paid fallback for producers (Claude Haiku 5.5).
  - model_name: dp-producer-paid
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---------- verifier / skeptic / writer (cross-family vs producers) ----------
  - model_name: dp-verifier
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: dp-verifier-budget
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 2
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
    - dp-producer: [dp-producer-paid]
    - dp-verifier: [dp-verifier-budget]

litellm_settings:
  drop_params: true
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
