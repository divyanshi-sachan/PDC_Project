# LiteLLM proxy — one model group per agent role. Model ids verified against each
# provider's /models endpoint on 2026-11-21 with the project's own keys.
# App code only ever uses the group names below ("dp-producer", ...).

model_list:
  # ---------- producers: research / modeling / forensic / orchestrator ----------
  # Free tiers first (public SEC text only). LiteLLM load-balances and cools down on 429.
  - model_name: dp-producer
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
    model_info: { family: gemini }
  - model_name: dp-producer
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
      tpm: 8000
    model_info: { family: gpt-oss }
  - model_name: dp-producer
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
    model_info: { family: gemma }

  # Paid fallback for producers.
  - model_name: dp-producer-paid
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---------- verifier / skeptic / writer (different family from the free producers) ----------
  - model_name: dp-verifier
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: dp-verifier-budget
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---------- embeddings (free Gemini tier, public SEC text only) ----------
  - model_name: dp-embed
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 2
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
    - dp-producer: [dp-producer-paid]
    - dp-verifier: [dp-verifier-budget]

litellm_settings:
  drop_params: true
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
