# Local services. The app's database is NEON (see neon.ts / CLAUDE.md); the `db`
# service here is only for offline tests (TEST_DATABASE_URL) and CI parity.
#   docker compose -f infra/docker-compose.yml up -d db            # offline test Postgres
#   docker compose -f infra/docker-compose.yml --profile all up -d # + LiteLLM + edgar-service
name: dealpilot

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: dealpilot
      POSTGRES_PASSWORD: dealpilot
      POSTGRES_DB: dealpilot
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealpilot"]
      interval: 3s
      retries: 20

  litellm:
    profiles: ["all"]
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4001"]
    ports: ["4001:4001"]
    env_file: ../.env
    volumes: ["./litellm/config.yaml:/app/config.yaml:ro"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request;urllib.request.urlopen(''http://localhost:4001/health/liveliness'')"',
        ]
      interval: 10s
      retries: 10

  edgar:
    profiles: ["all"]
    build: ../services/edgar
    ports: ["8100:8100"]
    env_file: ../.env
    environment:
      EDGAR_CACHE_DIR: /cache
    volumes: ["edgarcache:/cache"]

volumes:
  pgdata:
  edgarcache:
