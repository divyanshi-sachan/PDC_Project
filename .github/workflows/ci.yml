name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: dealpilot
          POSTGRES_PASSWORD: dealpilot
          POSTGRES_DB: dealpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dealpilot" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgres://dealpilot:dealpilot@localhost:5432/dealpilot
      TEST_DATABASE_URL: postgres://dealpilot:dealpilot@localhost:5432/dealpilot
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node .claude/hooks/check_finance_purity.mjs $(git ls-files 'packages/finance/src/*.ts')
      - run: pnpm db:migrate
      - run: pnpm test

  edgar-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/edgar
    env:
      SEC_USER_AGENT: "DealPilot CI ci@example.com"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: OpenAPI spec is up to date
        run: |
          uv run python -m edgar_service.export_openapi
          git diff --exit-code openapi.json
